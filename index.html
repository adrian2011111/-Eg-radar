<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🌶️ Chilli Finder</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
  padding:22px 16px 12px;
  text-align:center;
}
h1{margin:0;font-size:28px}
.sub{color:#aaa;margin-top:5px;font-size:13px}
.panel{
  margin:14px;
  padding:16px;
  border-radius:18px;
  background:#151515;
  border:1px solid #292929;
}
button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  color:white;
  background:#e53935;
}
button:active{transform:scale(.98)}
.status{
  margin-top:12px;
  color:#bbb;
  font-size:13px;
  text-align:center;
}
.server{
  margin-top:12px;
  padding:15px;
  border-radius:16px;
  background:#171717;
  border:1px solid #292929;
}
.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}
.name{font-weight:700}
.players{color:#aaa}
.join{
  margin-top:10px;
  padding:11px;
  font-size:14px;
  background:#2d7cff;
}
.empty{
  text-align:center;
  color:#aaa;
  padding:25px 5px;
}
.warning{
  color:#ffb74d;
  font-size:13px;
  line-height:1.4;
  margin-top:12px;
}
</style>
</head>

<body>

<header>
  <h1>🌶️ Chilli Finder</h1>
  <div class="sub">Roba un Huevo • iPhone</div>
</header>

<div class="panel">
  <button onclick="buscarServidores()">🔎 Buscar servidores</button>
  <div id="status" class="status">Pulsa el botón para buscar.</div>

  <div class="warning">
    ⚠️ Roblox puede limitar las consultas directas desde una página web.
    Este panel no inventa servidores ni inventa la ubicación del Chilli.
  </div>
</div>

<div id="servers" class="panel">
  <div class="empty">Todavía no hay servidores cargados.</div>
</div>

<script>
const PLACE_ID = "107778070777162";

async function buscarServidores(){
  const status = document.getElementById("status");
  const box = document.getElementById("servers");

  status.textContent = "🔄 Buscando servidores...";
  box.innerHTML = "";

  try {
    const url =
      "https://games.roblox.com/v1/games/" +
      PLACE_ID +
      "/servers/Public?sortOrder=Asc&limit=100";

    const response = await fetch(url);

    if(!response.ok){
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if(!data.data || data.data.length === 0){
      box.innerHTML =
        '<div class="empty">No se encontraron servidores públicos.</div>';
      status.textContent = "Sin resultados";
      return;
    }

    status.textContent =
      "✅ " + data.data.length + " servidores encontrados";

    data.data.forEach(server => {
      const div = document.createElement("div");
      div.className = "server";

      const playing = server.playing ?? "?";
      const maxPlayers = server.maxPlayers ?? "?";
      const id = server.id;

      div.innerHTML = `
        <div class="row">
          <span class="name">🌶️ Servidor público</span>
          <span class="players">${playing}/${maxPlayers}</span>
        </div>

        <div class="row">
          <span class="players">ID</span>
          <span class="players">${id.slice(0,8)}...</span>
        </div>

        <button class="join"
          onclick="abrirRoblox('${id}')">
          🎮 Abrir Roblox
        </button>
      `;

      box.appendChild(div);
    });

  } catch(error) {
    console.error(error);

    status.textContent = "❌ No se pudo consultar Roblox";

    box.innerHTML = `
      <div class="empty">
        Roblox no permitió la consulta directa desde Safari.
        <br><br>
        Prueba nuevamente o usa un backend autorizado.
      </div>
    `;
  }
}

function abrirRoblox(serverId){
  const placeId = PLACE_ID;

  const robloxUrl =
    "https://www.roblox.com/games/start?placeId=" +
    placeId +
    "&gameInstanceId=" +
    encodeURIComponent(serverId);

  window.location.href = robloxUrl;
}
</script>

</body>
</html>
